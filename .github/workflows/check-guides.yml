name: Check guides

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC: notice SDK releases that the guides have not caught up with
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guides:
    name: Guides only name APIs the SDKs have
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the checker
        run: python3 scripts/test_check_guides.py
      - name: Check guides against sdk-symbols/
        run: python3 scripts/check_guides.py -v

  symbols:
    name: sdk-symbols/ matches the published SDKs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate sdk-symbols/ from the public registries
        run: python3 scripts/update_sdk_symbols.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the guides against the newest SDKs
        run: python3 scripts/check_guides.py -v
      - name: Fail if sdk-symbols/ is out of date
        if: always()
        run: |
          if ! git diff --exit-code --stat -- sdk-symbols/; then
            echo "::error::sdk-symbols/ is behind the published SDKs. Run scripts/update_sdk_symbols.py, then scripts/check_guides.py, and update the guides."
            exit 1
          fi
